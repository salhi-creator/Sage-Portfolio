<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Runs before paint so the correct theme applies immediately, no flash. -->
    <script>
      (function () {
        //pp
        try {
          var stored = localStorage.getItem("sage-theme");
          var theme = stored === "light" ? "light" : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <title>Sage — Developer &amp; Builder</title>
    <meta
      name="description"
      content="Personal workshop and project archive of Hakim — a computer science student and independent developer building across mobile, web, backend, and games."
    />
    <link rel="canonical" href="https://sage-portfolio-eta.vercel.app" />

    <meta name="google-site-verification" content="gwqsZkxRB1y5hJCTeQDkUf7h3h7KlIpm4aG2hyD56Fo" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sage — Developer & Builder" />
    <meta
      property="og:description"
      content="I build things I don't know how to build yet. A personal archive of mobile, web, backend, game, and AI projects."
